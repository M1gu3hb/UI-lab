name: Restore UI Lab source

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find bootstrap -maxdepth 1 -name 'part-*.txt' -print -quit)"
          cat bootstrap/part-*.txt | tr -d '\n\r ' | base64 --decode > ui-lab-source.zip
          unzip -t ui-lab-source.zip
          unzip -o ui-lab-source.zip
          rm -rf bootstrap ui-lab-source.zip .github/workflows/restore-source.yml
      - name: Validate reconstructed project
        run: npm run build
      - name: Commit real source files to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: restore complete UI Lab source'
          git push origin HEAD:main

name: Restore UI Lab source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-source.yml'
      - 'bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect source archive
        id: archive
        shell: bash
        run: |
          if compgen -G 'bootstrap/part-*.txt' > /dev/null; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct source archive
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-*.txt | tr -d '\n\r ' | base64 --decode > ui-lab-source.zip
          unzip -t ui-lab-source.zip
          unzip -o ui-lab-source.zip
          rm -rf bootstrap ui-lab-source.zip
      - name: Validate reconstructed project
        if: steps.archive.outputs.present == 'true'
        run: npm run build
      - name: Commit real source files
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: restore complete UI Lab source'
          git push origin HEAD:main
